name: Android TV release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: client/**

      - uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/coog-release.jks
          printf '%s\n' \
            "storeFile=keystore/coog-release.jks" \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyAlias=coog" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            > keystore.properties

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Package release assets
        id: pkg
        run: |
          python3 <<'PY'
          import json, os, pathlib, re, shutil
          gradle = pathlib.Path("app/build.gradle.kts").read_text()
          code = re.search(r"versionCode\s*=\s*(\d+)", gradle).group(1)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
          src = pathlib.Path("app/build/outputs/apk/release/app-release.apk")
          dest = pathlib.Path(f"app/build/outputs/apk/release/coog-tv-vc{code}-{name}.apk")
          shutil.copyfile(src, dest)
          meta_path = pathlib.Path("app/build/outputs/apk/release/app-update.json")
          meta_path.write_text(json.dumps({
              "versionCode": int(code),
              "versionName": name,
              "apk": dest.name,
          }, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"apk={dest}\n")
              fh.write(f"json={meta_path}\n")
              fh.write(f"version={name}\n")
              fh.write(f"code={code}\n")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v${{ steps.pkg.outputs.version }}"
          fi
          NOTES="Google TV client ${{ steps.pkg.outputs.version }} (versionCode ${{ steps.pkg.outputs.code }}).

          Sideload this APK once. After that, open Settings on the TV and press Update to install later GitHub releases. Studio debug builds use a different signing key — uninstall those before switching to this APK."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.pkg.outputs.apk }}" \
              "${{ steps.pkg.outputs.json }}" \
              --clobber
          else
            gh release create "$TAG" \
              --title "Coog TV ${{ steps.pkg.outputs.version }}" \
              --notes "$NOTES" \
              "${{ steps.pkg.outputs.apk }}" \
              "${{ steps.pkg.outputs.json }}"
          fi
