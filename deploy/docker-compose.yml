services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      COOG_LISTEN: ":8090"
      COOG_LIBRARY_PATH: /library
      COOG_DATA_PATH: /data
      COOG_AUTH_TOKEN: ${COOG_AUTH_TOKEN:-}
      COOG_FFMPEG: ffmpeg
      COOG_FFPROBE: ffprobe
    volumes:
      - ${COOG_LIBRARY_PATH:-${HOME}/Videos}:/library
      - coog-data:/data
    restart: unless-stopped

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/coog-worker"]
    environment:
      COOG_LIBRARY_PATH: /library
      COOG_DATA_PATH: /data
      COOG_FFMPEG: ffmpeg
      COOG_FFPROBE: ffprobe
      COOG_YTDLP: yt-dlp
    volumes:
      - ${COOG_LIBRARY_PATH:-${HOME}/Videos}:/library
      - coog-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  coog-data:
